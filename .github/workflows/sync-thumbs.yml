name: Sync project thumbs

# The full-res project image is the source of truth. Whenever it changes, the
# matching webp thumb is regenerated from it and committed back to the branch,
# so the two can never drift apart.
on:
  push:
    branches: [main]
    paths:
      - "public/assets/projects/**"
      - "!public/assets/projects/thumbs/**"
      - "src/content/projects/*.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-thumbs
  cancel-in-progress: true

jobs:
  sync:
    # Skip the commit this job itself pushes, so it never loops.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate thumbs from project images
        run: npm run thumbs

      - name: Commit regenerated thumbs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/projects/thumbs src/content/projects
          if git diff --staged --quiet; then
            echo "Project thumbs already in sync."
          else
            git commit -m "chore: regenerate project thumbs from source images"
            git push
          fi
