  2. Hoffmann et al. 2022, *Training Compute-Optimal Large Language Models*, DeepMind
  3. Sardana et al. 2024, *Beyond Chinchilla-Optimal: Accounting for Inference in Language Model Scaling Laws*
  4. Hernandez et al. 2022, *Sub-Scaling Laws: On the Role of Data Density and Training Strategies in LLMs*
  5. Shukla 2025, *The AI Scaling Wall of Diminishing Returns: Of LLMs, Electric Dogs, and General Relativity*
  6. 2025 arXiv, *When More Thinking Hurts: Overthinking in LLM Test-Time Compute Scaling*
