title: "Building the Future @ PXL Webworks"
date: "2026-04-30"
tags: ["business", "website", "development"]
summary: "Starting PXL Webworks, an immersive web design studio."
content: |-

  ![img1](/src/assets/projects/PXL-Hero.png)
  
  Starting a small business with a friend, PXL Webworks is our outlet for creating immersive websites. The website itself is a testament to our approach—immersive, heavy on animations, and focused on guiding the user's attention. 

  We believe that a website should be more than just content; it should be an experience. A lot of tiny details, that might not be seen at first sight by the user, are what actually make the experience clear and intuitive.

  Our philosophy is simple: create immersive digital experiences, focus on the details that others leave out, and ensure every animation serves a purpose to guide the user.

  Feel free to explore our new studio website [here](https://pxlwebworks.pages.dev) and check out my friend Casper's portfolio [here](https://casperadeboi.is-a.dev).
