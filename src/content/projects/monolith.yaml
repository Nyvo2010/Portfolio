  ### Storytelling Through Detail
  Monolith is an AI agency focused on reimagining operational efficiency. For the website, I opted for a scrollytelling approach. The design is intentionally minimal, allowing the user to focus on the story, yet it is packed with subtle details across unique scenes and sections to maintain engagement.
