  ### Building PXL Webworks
  Starting a small business with a friend, PXL Webworks is our outlet for creating immersive websites. The website itself is a testament to our approach—immersive, heavy on animations, and focused on guiding the user's attention. We believe that a website should be more than just content; it should be an experience.

  A lot of tiny details, that might not be seen at first sight by the user, are what actually make the experience clear and intuitive.
